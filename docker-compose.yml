services:
  mysql:
    image: mysql:8.4
    container_name: serviqa_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: serviqa_db
      MYSQL_USER: serviqa_user
      MYSQL_PASSWORD: serviqa_secure_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: serviqa_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "mysql://serviqa_user:serviqa_secure_pass@mysql:3306/serviqa_db"
      JWT_SECRET: "prod_super_secret_jwt_key_minimum_32_characters_here"
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "5000:5000"
    volumes:
      - api_uploads:/app/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: serviqa_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  mysql_data:
  api_uploads:
